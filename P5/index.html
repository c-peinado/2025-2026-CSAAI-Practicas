<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fútbol 2D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="menu">
  <h1>Juego de Fútbol 2D</h1>
  <button onclick="startGame('3goals')">Partido a 3 goles</button>
  <button onclick="startGame('golden')">Gol de oro</button>

</div>

<script src="game.js"></script>
</body>
</html>
